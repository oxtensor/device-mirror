[package]
name = "dm-vdevices"
version = "1.0.0"
edition = "2021"
description = "Device Mirror embedded virtual camera + mic pump"

[dependencies]
anyhow = "1"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
